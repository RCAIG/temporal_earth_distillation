[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-earth-distillation"
version = "0.1.0"
description = "Temporal Earth Distillation for pixel-based satellite image time series pre-training and downstream Earth observation tasks for evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TED contributors" }]
keywords = ["remote-sensing", "time-series", "self-supervised-learning", "HLS"]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "netCDF4>=1.6",
  "h5py>=3.8",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "einops>=0.7",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
spatial = ["pyproj>=3.5"]
reformer = ["reformer_pytorch"]

[tool.setuptools]
py-modules = ["train", "eval_downstream"]

[tool.setuptools.packages.find]
include = ["models*", "modules*", "layers*", "data*", "engine*", "eval*", "utils*"]
